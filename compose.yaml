services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: app
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://sqlwise:sqlwise_dev_only@postgres:5432/sqlwise_platform?sslmode=disable
      SQLWISE_CONNECTION_KEY: ${SQLWISE_CONNECTION_KEY:-I7fWIhEZr5Q+tMLSjrP1LXprBoDi1Iz65M5fQ4oPbr4=}
      SQLWISE_ADMIN_USERNAME: ${SQLWISE_ADMIN_USERNAME:-admin}
      SQLWISE_ADMIN_PASSWORD: ${SQLWISE_ADMIN_PASSWORD:-SqlwiseAdminLocal2026!}
    command:
      - sh
      - -ec
      - |
        printf '%s' "$$SQLWISE_ADMIN_PASSWORD" | sqlwise-admin -username "$$SQLWISE_ADMIN_USERNAME" -password-stdin -if-not-exists
        exec sqlwise
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sqlwise
      POSTGRES_PASSWORD: sqlwise_dev_only
      POSTGRES_DB: sqlwise_platform
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlwise -d sqlwise_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  target:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: target_owner
      POSTGRES_PASSWORD: target_owner_dev_only
      POSTGRES_DB: sqlwise_demo
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - target_data:/var/lib/postgresql/data
      - ./deploy/target:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U target_owner -d sqlwise_demo"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    profiles: ["bonus"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root_dev_only
      MYSQL_DATABASE: sqlwise_demo
      MYSQL_USER: sqlwise_target
      MYSQL_PASSWORD: sqlwise_target_dev_only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -pmysql_root_dev_only --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  target_data:
  mysql_data:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sqlwise
      POSTGRES_PASSWORD: sqlwise_dev_only
      POSTGRES_DB: sqlwise_platform
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlwise -d sqlwise_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  target:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: target_owner
      POSTGRES_PASSWORD: target_owner_dev_only
      POSTGRES_DB: sqlwise_demo
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - target_data:/var/lib/postgresql/data
      - ./deploy/target:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U target_owner -d sqlwise_demo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  target_data:

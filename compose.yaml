services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sqlwise
      POSTGRES_PASSWORD: sqlwise_dev_only
      POSTGRES_DB: sqlwise_platform
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlwise -d sqlwise_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

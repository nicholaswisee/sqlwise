name: CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sqlwise_test
          POSTGRES_PASSWORD: sqlwise_ci_only
          POSTGRES_DB: sqlwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlwise_test -d sqlwise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sqlwise_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -psqlwise_ci_only --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "lts"
          cache: true
          run-install: true

      - name: Check frontend
        run: vp check

      - name: Check SPA types
        run: vp run spa:check

      - name: Test SPA
        run: vp run spa:test

      - name: Generate templ
        run: go tool templ generate

      - name: Check generated templ files
        run: |
          if [ -n "$(git status --porcelain -- internal/web/views)" ]; then
            git status --short -- internal/web/views
            exit 1
          fi

      - name: Go format check
        run: |
          files=$(gofmt -l $(find cmd internal -name '*.go'))
          if [ -n "$files" ]; then echo "$files"; exit 1; fi

      - name: Go vet
        run: go vet ./...

      - name: Go test
        env:
          TEST_DATABASE_URL: postgres://sqlwise_test:sqlwise_ci_only@localhost:5432/sqlwise_test?sslmode=disable
          TEST_MYSQL_URL: root:sqlwise_ci_only@tcp(localhost:3306)/
        run: go test -race -shuffle=on -count=1 ./...

      - name: Build assets
        run: vp build

      - name: Build static SPA
        run: vp run spa:build

      - name: Build Go server
        run: go build -o bin/sqlwise ./cmd/server

      - name: Build administrator setup
        run: go build -o bin/sqlwise-admin ./cmd/admin

      - name: SPA browser tests through Go static serving
        env:
          APP_ENV: production
          DATABASE_URL: postgres://sqlwise_test:sqlwise_ci_only@localhost:5432/sqlwise_test?sslmode=disable
          SQLWISE_CONNECTION_KEY: I7fWIhEZr5Q+tMLSjrP1LXprBoDi1Iz65M5fQ4oPbr4=
          SQLWISE_E2E_URL: http://localhost:8080
          SQLWISE_E2E_USERNAME: admin
          SQLWISE_E2E_PASSWORD: SqlwiseAdminLocal2026!
        run: |
          vp exec playwright install --with-deps chromium
          printf '%s' "$SQLWISE_E2E_PASSWORD" | ./bin/sqlwise-admin -username "$SQLWISE_E2E_USERNAME" -password-stdin -if-not-exists
          ./bin/sqlwise > "$RUNNER_TEMP/sqlwise-spa.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8080/health
          env -u SQLWISE_E2E_URL vp run spa:e2e
          vp run spa:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spa-browser-results
          path: web/spa/test-results/
          if-no-files-found: ignore

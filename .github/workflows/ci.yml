name: CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sqlwise_test
          POSTGRES_PASSWORD: sqlwise_ci_only
          POSTGRES_DB: sqlwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlwise_test -d sqlwise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sqlwise_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -psqlwise_ci_only --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "lts"
          cache: true
          run-install: true

      - name: Check frontend
        run: vp check

      - name: Generate templ
        run: go tool templ generate

      - name: Check generated templ files
        run: |
          if [ -n "$(git status --porcelain -- internal/web/views)" ]; then
            git status --short -- internal/web/views
            exit 1
          fi

      - name: Go format check
        run: |
          files=$(gofmt -l $(find cmd internal -name '*.go'))
          if [ -n "$files" ]; then echo "$files"; exit 1; fi

      - name: Go vet
        run: go vet ./...

      - name: Go test
        env:
          TEST_DATABASE_URL: postgres://sqlwise_test:sqlwise_ci_only@localhost:5432/sqlwise_test?sslmode=disable
          TEST_MYSQL_URL: root:sqlwise_ci_only@tcp(localhost:3306)/
        run: go test -race -shuffle=on -count=1 ./...

      - name: Build assets
        run: vp build

      - name: Build Go server
        run: go build -o bin/sqlwise ./cmd/server

      - name: Build administrator setup
        run: go build -o bin/sqlwise-admin ./cmd/admin
